name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: StudyLapseCore tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version && ls /Applications | grep Xcode
      - name: Forbid Apple framework imports in StudyLapseCore
        run: |
          if grep -rEn '^\s*import\s+(SwiftData|AVFoundation|SwiftUI|UIKit)\b' StudyLapseCore/Sources; then
            echo "Forbidden import found in StudyLapseCore/Sources" >&2
            exit 1
          fi
      - name: Test
        run: swift test --package-path StudyLapseCore

  simulator:
    name: Simulator tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Find an available iOS Simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '
            .devices
            | to_entries
            | map(select(.key | contains("iOS")))
            | map(.value) | flatten
            | map(select(.isAvailable and (.name | contains("iPhone"))))
            | .[0].udid
          ')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "No available iPhone simulator found on this runner" >&2
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Test
        run: |
          xcodebuild \
            -project StudyLapse.xcodeproj \
            -scheme StudyLapse \
            -destination 'id=${{ steps.sim.outputs.udid }}' \
            CODE_SIGNING_ALLOWED=NO \
            test

  app:
    name: App target compiles
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for simulator (unsigned)
        run: |
          xcodebuild \
            -project StudyLapse.xcodeproj \
            -scheme StudyLapse \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

  ipa:
    name: Unsigned IPA artifact
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Archive unsigned
        run: |
          xcodebuild \
            -project StudyLapse.xcodeproj \
            -scheme StudyLapse \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -archivePath build/StudyLapse.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive
      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/StudyLapse.xcarchive/Products/Applications/StudyLapse.app Payload/
          zip -qry StudyLapse.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: StudyLapse-unsigned-ipa
          path: StudyLapse.ipa
