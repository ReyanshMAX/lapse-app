name: StudyLapse
options:
  bundleIdPrefix: com.placeholder
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  StudyLapseCore:
    path: StudyLapseCore
targets:
  StudyLapse:
    type: application
    platform: iOS
    sources:
      - path: StudyLapse
      # StudyLapseActivityAttributes.swift crosses the app/widget-extension
      # process boundary (docs/ARCHITECTURE.md: no separate framework in v1),
      # so it's compiled into both targets from this one file.
      - path: StudyLapseActivity/StudyLapseActivityAttributes.swift
    dependencies:
      - package: StudyLapseCore
      - target: StudyLapseActivity
        embed: true
    scheme:
      testTargets:
        - StudyLapseTests
    info:
      properties:
        # NSSupportsLiveActivities and CFBundleURLTypes are booleans/arrays,
        # which a build-setting-only Info.plist can't express — merged in
        # alongside the GENERATE_INFOPLIST_FILE-synthesized keys below.
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - studylapse
            CFBundleURLName: com.placeholder.studylapse
    settings:
      base:
        PRODUCT_NAME: StudyLapse
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: >-
          StudyLapse records a timelapse of your study session using the camera.
          Video stays on this device and is never uploaded.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: >-
          Used only when you record a voiceover over a finished timelapse.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: >-
          Used to save your exported timelapse to Photos.
  StudyLapseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StudyLapseTests
    dependencies:
      - target: StudyLapse
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  # Live Activity widget extension (docs/UI.md "Live Activity"; BUILD.md
  # Phase 7). A second bundle ID — counts against the free Apple ID's
  # three-app limit (docs/SETUP.md), which is why this stayed out of scope
  # until Phase 7.
  StudyLapseActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: StudyLapseActivity
    dependencies:
      - package: StudyLapseCore
    info:
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: StudyLapseActivity
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
