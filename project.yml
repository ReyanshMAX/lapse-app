name: StudyLapse
options:
  bundleIdPrefix: com.placeholder
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  StudyLapseCore:
    path: StudyLapseCore
targets:
  StudyLapse:
    type: application
    platform: iOS
    sources:
      - path: StudyLapse
        excludes:
          - Info.plist
      # StudyLapseActivityAttributes.swift crosses the app/widget-extension
      # process boundary (docs/ARCHITECTURE.md: no separate framework in v1),
      # so it's compiled into both targets from this one file.
      - path: StudyLapseActivity/StudyLapseActivityAttributes.swift
    dependencies:
      - package: StudyLapseCore
      - target: StudyLapseActivity
        embed: true
    scheme:
      testTargets:
        - StudyLapseTests
    settings:
      base:
        PRODUCT_NAME: StudyLapse
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # A checked-in Info.plist, not GENERATE_INFOPLIST_FILE — this target
        # needs CFBundleURLTypes (the Resume deep link) and
        # NSSupportsLiveActivities, which are an array/boolean a
        # build-setting-only Info.plist can't express.
        INFOPLIST_FILE: StudyLapse/Info.plist
  StudyLapseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StudyLapseTests
    dependencies:
      - target: StudyLapse
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  # Live Activity widget extension (docs/UI.md "Live Activity"; BUILD.md
  # Phase 7). A second bundle ID — counts against the free Apple ID's
  # three-app limit (docs/SETUP.md), which is why this stayed out of scope
  # until Phase 7.
  StudyLapseActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: StudyLapseActivity
        excludes:
          - Info.plist
    dependencies:
      - package: StudyLapseCore
    settings:
      base:
        PRODUCT_NAME: StudyLapseActivity
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: StudyLapseActivity/Info.plist
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        # An extension's bundle ID must be the parent app's, prefixed — a
        # sibling ID makes both the simulator and a real install refuse it
        # ("Mismatched bundle IDs"). XcodeGen's per-target default
        # (bundleIdPrefix.TargetName) gives siblings, so this is explicit.
        PRODUCT_BUNDLE_IDENTIFIER: com.placeholder.StudyLapse.StudyLapseActivity
